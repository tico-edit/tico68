name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Host tests
        run: make unit

  build:
    runs-on: ubuntu-24.04
    container: ghcr.io/autc04/retro68:latest
    env:
      RETRO68: /Retro68-build/toolchain
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: make

      - name: Check
        run: RETRO68=$RETRO68 sh scripts/check-build.sh build/mac

      - uses: actions/upload-artifact@v4
        with:
          name: tico68-800k
          path: build/mac/tico68-800k.dsk

      - name: StuffIt archive
        run: make sit

      - uses: actions/upload-artifact@v4
        with:
          name: tico68-sit
          path: |
            build/mac/tico68.sit
            build/mac/tico68.bin
            build/mac/ReadMe.txt
          if-no-files-found: error

  # On the runner itself, where unar is a package away: it's what checks the
  # archive, independently of what wrote it.
  sit:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: tico68-sit
          path: build/mac

      - name: Install The Unarchiver
        run: sudo apt-get update && sudo apt-get install -y unar

      - name: Check
        run: python3 scripts/check-sit.py build/mac
